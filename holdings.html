    <script>
/* ============================================================
   SHARED QUOTE CACHE

   Every page on this site needs the same quotes, and the Finnhub free tier
   allows 60 calls a minute. Loaded independently that is index 33 +
   performance 33 + holdings 27 + three DCF pages = 96 calls, so whichever
   page you opened second used to receive HTTP 429 and quietly fall back to
   its baked-in prices — which looked like "Finnhub works on some pages and
   not others" with no visible cause.

   All pages now read and write one cache in the browser. The first page to
   load pays for the quotes; every other page reads them for free until they
   expire. Entries are timestamped individually, so a page that only needs
   one symbol never refreshes the other thirty-two.
   ============================================================ */
var QC_KEY = 'shourjo_quotes_v1';
var QC_TTL = 120000;                       /* 2 minutes */

function qcacheAll() {
    try { return JSON.parse(localStorage.getItem(QC_KEY) || '{}') || {}; }
    catch (e) { return {}; }               /* storage disabled — behave as a miss */
}
function qcacheGet(sym) {
    var e = qcacheAll()[sym];
    if (!e || !(e.c > 0)) return null;
    if (Date.now() - e.at > QC_TTL) return null;
    return {c: e.c, ms: e.ms};
}
function qcachePut(map) {
    try {
        var q = qcacheAll(), now = Date.now();
        for (var k in map) if (map[k] && map[k].c > 0)
            q[k] = {c: map[k].c, ms: map[k].ms || now, at: now};
        localStorage.setItem(QC_KEY, JSON.stringify(q));
    } catch (e) { /* storage full or disabled — the page still works, just uncached */ }
}
function qcacheAge() {
    var q = qcacheAll(), newest = 0;
    for (var k in q) if (q[k] && q[k].at > newest) newest = q[k].at;
    return newest ? Math.round((Date.now() - newest) / 1000) : null;
}

</script>

        const priceCache = {};
        const FINNHUB_API_KEY = 'da11ropr01qo0t0kpao0da11ropr01qo0t0kpaog';
        const JAPAN_STOCKS = [];  // all holdings now use Finnhub-priceable ADR tickers

        async function fetchPriceStooq(nativeTicker, currency) {
            try {
                const response = await fetch(
                    `https://stooq.com/q/l/?s=${nativeTicker}&f=sd2t2ohlcv&h&e=csv`
                );

                if (response.ok) {
                    const csv = await response.text();
                    const lines = csv.trim().split('\n');
                    if (lines.length > 1) {
                        const data = lines[1].split(',');
                        const price = parseFloat(data[2]); // Close price is typically in column 2
                        if (!isNaN(price)) {
                            return {
                                price: price.toFixed(2),
                                currency: currency
                            };
                        }
                    }
                }
            } catch (e) {
                console.log(`Could not fetch from Stooq for ${nativeTicker}`);
            }
            return null;
        }

        async function fetchPrice(ticker, nativeTicker, currency) {
            if (priceCache[ticker]) {
                return priceCache[ticker];
            }

            try {
                // Use Stooq for Japanese stocks
                if (JAPAN_STOCKS.includes(ticker)) {
                    const result = await fetchPriceStooq(nativeTicker, currency);
                    if (result) {
                        priceCache[ticker] = result;
                        return result;
                    }
                } else {
                    /* another page may already have this quote — spending a call on it
                       again is what pushes the site past the 60/minute free-tier limit */
                    const shared = qcacheGet(ticker);
                    if (shared) {
                        priceCache[ticker] = {price: shared.c.toFixed(2), currency: currency};
                        return priceCache[ticker];
                    }
                    const response = await fetch(
                        `https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${FINNHUB_API_KEY}`
                    );

                    if (response.ok) {
                        const data = await response.json();
                        if (data.c) {
                            qcachePut({[ticker]: {c: data.c, ms: (data.t ? data.t*1000 : Date.now())}});
                            priceCache[ticker] = {
                                price: data.c.toFixed(2),
                                currency: currency
                            };
                            return priceCache[ticker];
                        }
                    }

                    // Fallback: try native ticker with Finnhub
                    const response2 = await fetch(
                        `https://finnhub.io/api/v1/quote?symbol=${nativeTicker}&token=${FINNHUB_API_KEY}`
                    );

                    if (response2.ok) {
                        const data = await response2.json();
                        if (data.c) {
                            priceCache[ticker] = {
                                price: data.c.toFixed(2),
                                currency: currency
                            };
                            return priceCache[ticker];
                        }
                    }
                }
            } catch (e) {
                console.log(`Could not fetch price for ${ticker}`);
            }
            return null;
        }

        async function refreshAllPrices() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('loading');
            btn.textContent = 'LOADING...';

            let updated = 0;
            for (const holding of holdings) {
                const priceEl = document.querySelector(`[data-ticker="${holding.nativeTicker}"]`);

                // Show unavailable for Japanese stocks
                if (JAPAN_STOCKS.includes(holding.ticker)) {
                    if (priceEl) {
                        priceEl.innerHTML = `<div class="card-price-loading">N/A</div>`;
                    }
                } else {
                    // Fetch price from Finnhub for others
                    const priceData = await fetchPrice(holding.ticker, holding.nativeTicker, holding.currency);
                    if (priceData) {
                        if (priceEl) {
                            priceEl.innerHTML = `<div class="card-price-value">${priceData.currency} ${priceData.price}</div><div class="card-price-currency">${priceData.currency}</div>`;
                            updated++;
                        }
                    }
                }
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            document.getElementById('lastUpdate').textContent = `Last updated: ${new Date().toLocaleString()} (${updated}/${holdings.length} prices loaded)`;
            btn.classList.remove('loading');
            btn.textContent = 'REFRESH PRICES';
        }

        function renderHoldings(filtered = holdings) {
            const list = document.getElementById('holdingsList');
            list.innerHTML = '';

            if (filtered.length === 0) {
                list.innerHTML = '<div class="no-results">No holdings found matching your search.</div>';
                return;
            }

            filtered.forEach((holding, index) => {
                const card = document.createElement('div');
                card.className = 'holding-card';
                const DCF_PAGES = {"CRH plc": "crh_dcf.html", "Imperial Oil": "imo_dcf.html", "Teva Pharmaceutical": "teva_dcf.html"};
                const DCF_PENDING = {};
                const dcfButton = DCF_PAGES[holding.name]
                    ? '<button class="dcf-btn" onclick="openDCF(event, \'' + DCF_PAGES[holding.name] + '\')">DCF</button>'
                    : (DCF_PENDING[holding.name]
                        ? '<button class="dcf-btn" disabled title="DCF model not built yet" '
                          + 'style="opacity:.35;cursor:not-allowed">DCF</button>'
                        : '');
                card.innerHTML = `
                    <div class="card-header" onclick="openCard(${index})">
                        <div class="card-info">
                            <div class="card-title">${holding.name}${dcfButton}</div>
                            <div class="card-ticker">${holding.ticker}</div>
                        </div>
                        <div class="card-price" data-ticker="${holding.nativeTicker}">
                            <div class="card-price-loading">loading...</div>
                        </div>
                        <div class="toggle-btn" title="open">▶</div>
                    </div>
                    <div class="card-content" id="card-${index}">
                        ${holding.content}
                    </div>
                `;
                list.appendChild(card);
            });

            refreshAllPrices();
        }

        /* Open the write-up as a pop-out. The card keeps its own copy in the
           document; the pop-out shows a clone, so reopening always shows the
           original and the card is never left empty. */
        function openCard(index) {
            const src = document.getElementById(`card-${index}`);
            if (!src) return;
            const card = src.closest('.holding-card');
            const titleEl = card.querySelector('.card-title');
            const head = document.getElementById('mdlTitle');
            head.textContent = titleEl.childNodes[0].textContent.trim();
            /* carry the card's DCF button into the pop-out title. cloneNode keeps
               the inline onclick, so it still navigates to the model page. */
            const dcf = titleEl.querySelector('.dcf-btn');
            if (dcf) head.appendChild(dcf.cloneNode(true));
            document.getElementById('mdlTicker').textContent =
                card.querySelector('.card-ticker').textContent.trim();
            const body = document.getElementById('mdlBody');
            body.innerHTML = '';
            const clone = src.cloneNode(true);
            clone.removeAttribute('id');
            body.appendChild(clone);
            document.getElementById('cardMdl').classList.add('on');
            document.body.style.overflow = 'hidden';
            document.getElementById('mdlX').focus();
        }

        function closeCard() {
            document.getElementById('cardMdl').classList.remove('on');
            document.getElementById('mdlBody').innerHTML = '';
            document.body.style.overflow = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const m = document.getElementById('cardMdl');
            document.getElementById('mdlX').onclick = closeCard;
            m.addEventListener('click', ev => { if (ev.target === m) closeCard(); });
            addEventListener('keydown', ev => { if (ev.key === 'Escape') closeCard(); });
        });

        function openDCF(event, page) {
            event.stopPropagation();
            const currentPath = window.location.pathname;
            const directory = currentPath.substring(0, currentPath.lastIndexOf('/'));
            window.location.href = directory + '/' + page;
        }

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = holdings.filter(h =>
                h.name.toLowerCase().includes(query) ||
                h.ticker.toLowerCase().includes(query)
            );
            renderHoldings(filtered);
        });

        document.getElementById('refreshBtn').addEventListener('click', refreshAllPrices);

        renderHoldings();
    </script>
